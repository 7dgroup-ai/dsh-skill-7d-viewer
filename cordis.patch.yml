# dsh-skill-7d-viewer bundle patch.
#
# This file is the `dsh.bundle.patch` layer of the published npm package. When
# the plugin is installed through the official CLI:
#
#   dsh plugin --profile <name> add @7dgroup/dsh-skill-7d-viewer@<version>
#
# the command appends `@7dgroup/dsh-skill-7d-viewer` to `dsh.profile.bundles`,
# and the profile boot merges THIS patch (a single `insert` of the plugin row).
# No profile file edits are needed.
#
# The host half is intentionally a no-op: this is a pure browser UI plugin, so
# the row only needs to exist so the client half is discovered and mounted.
- insert:
    - id: skill-7d-viewer
      name: '@7dgroup/dsh-skill-7d-viewer'
